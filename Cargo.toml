[package]
name = "webhook-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
erdp = "0.2.1"
futures = { version = "0.3.34", features = ["async-await"], default-features = false }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "signal"] }
tokio-rustls = { version = "0.26.6", features = ["aws_lc_rs", "tls12"], default-features = false }
tokio-util = "0.7.20"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "symbols"
