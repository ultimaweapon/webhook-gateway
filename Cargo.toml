[package]
name = "webhook-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.12.0", features = ["behavior-version-latest"], default-features = false }
aws-sdk-route53 = { version = "1.127.0", default-features = false }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "help", "std", "usage"], default-features = false }
erdp = "0.2.1"
futures = { version = "0.3.34", features = ["async-await"], default-features = false }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
instant-acme = { version = "0.8.5", features = ["hyper-rustls", "ring"], default-features = false }
minicbor-serde = { version = "0.7.1", features = ["std"] }
rustc-hash = "2.1.3"
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "signal"] }
tokio-rustls = { version = "0.26.6", features = ["ring", "tls12"], default-features = false }
tokio-util = { version = "0.7.20", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "symbols"
